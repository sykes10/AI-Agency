<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Press Agency</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <h1>Press Agency</h1>

  <form id="create-form">
    <textarea id="idea" placeholder="Describe your idea (e.g. Understanding event loops in Node.js)" required></textarea>
    <input type="text" id="audience" placeholder="Audience (e.g. Backend engineers)" required />
    <select id="content-type">
      <option value="blueprint">Blueprint</option>
      <option value="pattern">Pattern</option>
    </select>
    <select id="depth">
      <option value="deep-dive">Deep dive</option>
      <option value="overview">Overview</option>
    </select>
    <button type="submit">Generate article</button>
  </form>

  <div class="panel">
    <strong>Recent articles</strong>
    <ul id="recent-list"></ul>
  </div>

  <script src="/common.js"></script>
  <script src="/home.js"></script>
</body>
</html>
